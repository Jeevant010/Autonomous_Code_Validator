<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>ACV · Patch verifier</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%236ee7b7'/%3E%3Ctext x='32' y='42' font-size='23' text-anchor='middle' font-family='monospace' font-weight='700' fill='%230b1115'%3EACV%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">A</div>
          <div class="brand-text">
            <strong>ACV</strong>
            <span>patch verifier</span>
          </div>
          <span class="build-tag" id="build-version">v0.2.0</span>
        </div>

        <div class="workspace-box">
          <span class="workspace-label">workspace</span>
          <span class="workspace-name">security_workers</span>
          <span class="workspace-meta" id="workspace-meta">11 fixtures</span>
        </div>

        <nav class="nav" aria-label="Console sections">
          <div class="nav-group">
            <div class="nav-group-label">Workspace</div>
            <button class="nav-item active" data-view="overview">
              <span class="nav-glyph">⌂</span>Dashboard
            </button>
            <button class="nav-item" data-view="tasks">
              <span class="nav-glyph">⌘</span>Task explorer
            </button>
            <button class="nav-item" data-view="patch">
              <span class="nav-glyph">✎</span>Patch lab
              <span class="nav-badge">input</span>
            </button>
          </div>
          <div class="nav-group">
            <div class="nav-group-label">Evaluation</div>
            <button class="nav-item" data-view="tools">
              <span class="nav-glyph">◫</span>Checker qualification
            </button>
            <button class="nav-item" data-view="audit">
              <span class="nav-glyph">⊞</span>Audit matrix
            </button>
          </div>
          <div class="nav-group">
            <div class="nav-group-label">Review</div>
            <button class="nav-item" data-view="review">
              <span class="nav-glyph">◎</span>Model review
            </button>
          </div>
        </nav>

        <div class="sidebar-bottom">
          <div class="env-row"><span>API</span><strong id="env-api">checking</strong></div>
          <div class="env-row"><span>Model</span><strong id="env-model">checking</strong></div>
          <div class="env-row"><span>Tasks</span><strong id="env-tasks">—</strong></div>
          <div class="env-row"><span>Key</span><strong id="env-key">checking</strong></div>
          <div class="sidebar-note">
            Local execution. Candidate code runs on this host until the sandbox adapter lands.
          </div>
        </div>
      </aside>

      <main class="main">
        <header class="page-header">
          <div>
            <div class="breadcrumb" id="view-eyebrow">workspace / dashboard</div>
            <h1 id="view-title">Dashboard</h1>
          </div>
          <div class="page-actions">
            <span id="global-status" class="status-pill">connecting</span>
            <button class="btn ghost" id="refresh-btn" type="button">Refresh</button>
          </div>
        </header>

        <div id="view-root" class="view-root" aria-live="polite"></div>
      </main>
    </div>

    <div id="toast" class="toast" role="status"></div>
    <script src="/static/app.js"></script>
  </body>
</html>
